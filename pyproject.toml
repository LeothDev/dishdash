[project]
name = "dishdash"
version = "0.1.0"
description = "A CLI Recipe Manager"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich (>=14.0.0,<15.0.0)",
    "argparse (>=1.4.0,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "pyfiglet (>=1.0.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
dishdash = "dishdash.cli:main"
